<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080,initial-scale=1">
  <title>News channel</title>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: 'News Serif'; src: url('assets/fonts/Georgia.ttf'); font-weight: 400; }
    @font-face { font-family: 'News Serif'; src: url('assets/fonts/Georgia-Bold.ttf'); font-weight: 700; }
    @font-face { font-family: 'News Sans'; src: url('assets/fonts/Arial.ttf'); font-weight: 400; }
    @font-face { font-family: 'News Sans'; src: url('assets/fonts/Arial-Bold.ttf'); font-weight: 700 900; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: {{BACKGROUND}}; }
    #news-channel { width: 1080px; height: 1920px; overflow: hidden; color: {{INK}}; background: {{BACKGROUND}}; font-family: 'News Sans', sans-serif; }
    .scene-content { display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); width: 100%; height: 100%; padding: 0; }
    .positioned { grid-area: 1 / 1; align-self: start; justify-self: start; min-width: 0; min-height: 0; }
    #brand { display: flex; align-items: center; justify-content: center; gap: 14px; font-family: 'News Serif', serif; font-weight: bold; line-height: 1.2; }
    #brand svg { width: 1.1em; height: 1.1em; flex: none; color: {{ACCENT}}; }
    #headline { margin: 0; text-align: center; font-family: 'News Serif', serif; font-weight: 400; line-height: 1.0625; letter-spacing: -0.035em; }
    #headline span { display: block; white-space: nowrap; }
    #visual-shell { position: relative; overflow: hidden; background: #DDE2D3; box-shadow: 0 10px 22px #20261720; }
    #visual-poster, .visual-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: {{VISUAL_FIT}}; }
    #visual-poster { z-index: 0; } .visual-video { z-index: 1; }
    #visual-label { text-align: center; line-height: 1.33; font-weight: bold; letter-spacing: 1px; color: #62675B; }
    #persona { position: relative; z-index: 2; }
    #persona-inner { position: relative; width: 1080px; height: 640px; transform: scale({{PERSONA_SCALE}}); transform-origin: top left; }
    #scene-window { position: absolute; left: {{SCENE_INSET}}px; top: {{SCENE_TOP}}px; width: {{SCENE_WIDTH}}px; height: {{SCENE_HEIGHT}}px; border-radius: {{CORNER_RADIUS}}px {{CORNER_RADIUS}}px 0 0; overflow: hidden; z-index: 0; }
    #persona-scene { position: absolute; max-width: none; object-fit: fill; }
    #persona-cutout { position: absolute; inset: 0; width: 1080px; height: 640px; object-fit: fill; z-index: 1; }
    #persona-overlay { position: absolute; left: 0; top: -1280px; width: 1080px; height: 1920px; object-fit: fill; z-index: 1; }
    #subtitle-zone { position: relative; z-index: 3; }
    .caption { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; font-size: inherit; }
    .caption-text { max-width: 100%; padding: 10px 23px 12px; border-radius: 15px; background: #50514D; color: #FFF; font-size: inherit; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
    .caption-text.accent { background: {{ACCENT}}; color: #171910; }
    {{LAYOUT_CSS}}
  </style>
</head>
<body>
  <div id="news-channel" data-composition-id="news-channel" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
    <div class="scene-content">
      <div id="brand" class="positioned"><svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"><path d="M24 3v42M3 24h42M9.2 9.2l29.6 29.6M9.2 38.8 38.8 9.2M16 4.6l16 38.8M4.6 16l38.8 16M4.6 32 43.4 16M16 43.4 32 4.6"/></g></svg><span>{{BRAND}}</span></div>
      <h1 id="headline" class="positioned">{{HEADLINE}}</h1>
      <div id="visual-shell" class="positioned">{{VISUAL_POSTER}}{{VISUAL_VIDEO}}</div>
      <div id="visual-label" class="positioned">{{VISUAL_LABEL}}</div>
      <div id="persona" class="positioned" data-layout-allow-overlap>
        <div id="persona-inner" data-layout-allow-overflow><div id="scene-window" data-layout-allow-overflow>{{SCENE_VIDEO}}</div>{{CUTOUT_VIDEO}}</div>
      </div>
      <div id="subtitle-zone" class="positioned" data-track-kind="captions">{{CAPTIONS}}</div>
    </div>
    {{AUDIO}}
  </div>
  <script>
    // Fit user-supplied text before constructing the synchronous GSAP timeline.
    function fitLine(element, maxWidth) {
      var style = getComputedStyle(element);
      var size = parseFloat(style.fontSize);
      var canvas = document.createElement('canvas');
      var context = canvas.getContext('2d');
      while (size > 16) {
        context.font = style.fontWeight + ' ' + size + 'px ' + style.fontFamily;
        var spacing = parseFloat(style.letterSpacing) || 0;
        if (context.measureText(element.textContent).width + Math.max(0, element.textContent.length - 1) * spacing <= maxWidth) break;
        size -= 1;
      }
      element.style.fontSize = size + 'px';
    }
    document.querySelectorAll('#headline span').forEach(function(el) { fitLine(el, el.parentElement.clientWidth); });
    document.querySelectorAll('.caption-text').forEach(function(el) { fitLine(el, document.getElementById('subtitle-zone').clientWidth - 46); });
    fitLine(document.querySelector('#brand span'), document.getElementById('brand').clientWidth - 70);
    fitLine(document.getElementById('visual-label'), document.getElementById('visual-label').clientWidth);
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    tl.from('#brand', { opacity: 0, scale: 0.98, duration: 0.32, ease: 'sine.out' }, 0.1);
    tl.from('#headline', { opacity: 0, y: 16, duration: 0.42, ease: 'power3.out' }, 0.16);
    tl.from('#visual-shell', { opacity: 0, scale: 0.99, duration: 0.4, ease: 'expo.out' }, 0.2);
    tl.from('#visual-label', { opacity: 0, x: 8, duration: 0.3, ease: 'power2.out' }, 0.26);
    tl.from('#persona', { opacity: 0, y: 16, duration: 0.42, ease: 'power3.out' }, 0.12);
    {{CAPTION_ANIMATIONS}}
    window.__timelines['news-channel'] = tl;
  </script>
</body>
</html>
