<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080,initial-scale=1">
  <title>Quick-cut tutorial</title>
  <script src="assets/vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: 'QC Sans'; src: url('assets/fonts/Poppins-SemiBold.ttf'); font-weight: 600; }
    @font-face { font-family: 'QC Sans'; src: url('assets/fonts/Poppins-Bold.ttf'); font-weight: 700; }
    @font-face { font-family: 'QC Sans'; src: url('assets/fonts/Poppins-ExtraBold.ttf'); font-weight: 800; }
    @font-face { font-family: 'QC Sans'; src: url('assets/fonts/Poppins-BoldItalic.ttf'); font-weight: 700; font-style: italic; }
    @font-face { font-family: 'QC Display'; src: url('assets/fonts/Anton-Regular.ttf'); font-weight: 400; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
    #quickcut { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; color: #FFF; font-family: 'QC Sans', sans-serif; }
    /* Layers: 0 blurred backdrop · 1 full-frame media and face · 2 shades and frames · 3 framed media · 4 notch, titles, profile · 20 captions · 30 flash */
    video, img { display: block; }
    .fill { position: absolute; left: 0; top: 0; z-index: 1; width: 1080px; height: 1920px; object-fit: cover; background: #000; }
    .fit-contain { object-fit: contain; }
    .face { object-position: 50% var(--focus, 35%); transform-origin: 50% var(--focus, 35%); }
    .blurbg { position: absolute; left: -120px; top: -200px; z-index: 0; width: 1320px; height: 2320px; object-fit: cover; filter: blur(36px) brightness(.5) saturate(1.25); }
    .shade { position: absolute; left: 0; top: 0; z-index: 2; width: 1080px; height: 1920px; }
    .dots { z-index: 0; overflow: hidden; }
    .dots::before, .dots::after { content: ''; position: absolute; border-radius: 50%; background: #FFFFFF; }
    .dots::before { left: -240px; top: 1330px; width: 520px; height: 520px; }
    .dots::after { right: -260px; top: 120px; width: 560px; height: 560px; }

    .split-top { position: absolute; left: 0; top: 0; z-index: 1; width: 1080px; height: {{SPLIT_AT}}px; object-fit: cover; background: #000; }
    .split-bottom { position: absolute; left: 0; top: {{SPLIT_BOTTOM}}px; z-index: 1; width: 1080px; height: {{SPLIT_HEIGHT}}px; object-fit: cover; }
    .divider { position: absolute; left: 0; top: {{SPLIT_AT}}px; z-index: 2; width: 1080px; height: 6px; background: {{DIVIDER}}; }
    .phone { position: absolute; left: 214px; top: 205px; z-index: 2; width: 652px; height: 1410px; border-radius: 94px; background: #0A0A0C;
      box-shadow: 0 40px 90px rgba(0, 0, 0, .55), inset 0 0 0 3px #2B2B31; }
    .phone-screen { position: absolute; left: 234px; top: 225px; z-index: 3; width: 612px; height: 1370px; border-radius: 76px; object-fit: cover; background: #000; }
    .phone-notch { position: absolute; left: 465px; top: 247px; z-index: 4; width: 150px; height: 40px; border-radius: 20px; background: #000; }
    .card { position: absolute; left: 135px; top: 255px; z-index: 3; width: 810px; height: 1410px; border-radius: 34px; object-fit: cover; background: #000;
      border: 3px solid rgba(255, 255, 255, .14); box-shadow: 0 30px 80px rgba(0, 0, 0, .5); }
    .inset { position: absolute; left: 144px; top: 1190px; z-index: 3; width: 792px; height: 820px; border-radius: 58px; object-fit: cover;
      border: 4px solid rgba(255, 255, 255, .9); box-shadow: 0 20px 60px rgba(0, 0, 0, .45); }
    .bubble { position: absolute; left: 300px; top: 190px; z-index: 3; width: 480px; height: 480px; border-radius: 50%; object-fit: cover;
      border: 9px solid #FFFFFF; box-shadow: 0 18px 50px rgba(0, 0, 0, .45); }

    .title-block { position: absolute; left: 40px; width: 1000px; z-index: 4; text-align: center; font-family: 'QC Display', sans-serif; line-height: .98; }
    .title-line { display: block; white-space: nowrap; text-shadow: 0 7px 0 rgba(0, 0, 0, .28), 0 0 34px rgba(0, 0, 0, .35); }
    .title-line.s { font-size: 104px; } .title-line.m { font-size: 168px; } .title-line.l { font-size: 220px; }
    .cta-block { position: absolute; left: 40px; top: 1170px; width: 1000px; z-index: 4; text-align: center; }
    .cta-comment { display: block; font-size: 88px; font-weight: 800; line-height: 1.02; letter-spacing: .01em; text-shadow: 0 5px 0 rgba(0, 0, 0, .3), 0 8px 26px rgba(0, 0, 0, .5); }
    .cta-keyword { display: block; font-family: 'QC Display', sans-serif; font-size: 132px; line-height: 1.04; color: {{ACCENT}}; white-space: nowrap; text-shadow: 0 6px 0 rgba(0, 0, 0, .3), 0 8px 26px rgba(0, 0, 0, .5); }
    .profile { position: absolute; left: 150px; top: 70px; z-index: 4; display: flex; align-items: center; gap: 28px; width: 780px; padding: 28px 32px;
      border: 2px solid #2D2D34; border-radius: 30px; background: #0E0E11; box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
    .profile-avatar { flex: none; width: 132px; height: 132px; border-radius: 50%; border: 4px solid {{ACCENT}}; background: #222 center / cover no-repeat; }
    .profile-text { display: block; min-width: 0; }
    .profile-name { display: block; font-size: 36px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
    .profile-handle { display: block; font-size: 26px; font-weight: 600; color: #AEB0B8; white-space: nowrap; }
    .profile-bio { display: block; margin-top: 6px; font-size: 24px; font-weight: 600; line-height: 1.3; color: #DADBE0; }
    .profile-follow { display: inline-block; margin-top: 14px; padding: 8px 30px; border-radius: 12px; background: #3B82F6; font-size: 24px; font-weight: 700; }

    .cap { position: absolute; left: 60px; z-index: 20; width: 960px; text-align: center; }
    .cap .line { display: block; white-space: nowrap; }
    .cap .w { display: inline-block; }
    .cap-kinetic .w { font-weight: 800; letter-spacing: -.01em; text-shadow: 0 4px 0 rgba(0, 0, 0, .35), 0 6px 22px rgba(0, 0, 0, .55); }
    .cap-kinetic .l1 { font-size: 72px; line-height: 1; color: #FFFFFF; }
    .cap-kinetic .l2 { font-size: 96px; line-height: 1; color: {{ACCENT}}; }
    .cap-italic .line { font-size: 46px; font-weight: 700; font-style: italic; line-height: 1.15; }
    .cap-italic .w { text-shadow: 0 3px 10px rgba(0, 0, 0, .75), 0 1px 2px rgba(0, 0, 0, .9); }
    .cap .w.hl { color: {{ACCENT}}; }
    .flash { position: absolute; inset: 0; z-index: 30; background: #FFFFFF; }
  </style>
</head>
<body>
  <div id="quickcut" data-composition-id="quickcut-tutorial" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
{{SEGMENTS}}
{{CAPTIONS}}
{{OVERLAYS}}
{{AUDIO}}
  </div>
  <script>
    var plan = {{PLAN}};
    // Shrink any line wider than its box before constructing the synchronous GSAP timeline.
    function fitLine(element, maxWidth) {
      var size = parseFloat(getComputedStyle(element).fontSize);
      while (size > 18 && element.scrollWidth > maxWidth) { size -= 2; element.style.fontSize = size + 'px'; }
    }
    document.querySelectorAll('.cap .line').forEach(function(el) { fitLine(el, 960); });
    document.querySelectorAll('.title-line, .cta-keyword, .cta-comment').forEach(function(el) { fitLine(el, 1000); });
    document.querySelectorAll('.profile-name, .profile-handle').forEach(function(el) { fitLine(el, el.parentElement.clientWidth); });
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    plan.words.forEach(function(w) { tl.from('#' + w.id, { opacity: 0, scale: 0.55, y: 18, duration: 0.14, ease: 'back.out(2.2)' }, w.t); });
    plan.pops.forEach(function(p) { tl.from('#' + p.id, { opacity: 0, scale: 0.6, y: 30, duration: 0.24, ease: 'back.out(1.8)' }, p.t); });
    plan.slides.forEach(function(s) { tl.from('#' + s.id, { y: -440, duration: 0.45, ease: 'back.out(1.3)' }, s.t); });
    plan.zooms.forEach(function(z) { tl.fromTo('#' + z.id, { scale: 1 }, { scale: 1.08, duration: z.d, ease: 'none' }, z.t); });
    plan.flashes.forEach(function(f) { tl.fromTo('#' + f.id, { opacity: 0.9 }, { opacity: 0, duration: 0.24, ease: 'power1.out' }, f.t); });
    tl.set('#quickcut', { opacity: 1 }, plan.duration);
    window.__timelines['quickcut-tutorial'] = tl;
  </script>
</body>
</html>
